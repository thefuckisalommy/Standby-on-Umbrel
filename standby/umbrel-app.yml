version: "0.7.22"
releaseNotes: "0.7.22: offline-gap grace — if the device was off for a while and comes back with the check-in clock far along, the broadcast is held for half the check-in window (17.5 days on the 35-day threshold) instead of firing the moment the device powers back on. The hold only applies when the device was offline for over a quarter of the window AND the clock is over halfway to the broadcast date, and it is measured from the moment the device comes back, so a months-long outage still leaves a real grace window. The check-in card reflects the held date everywhere: the countdown counts to it, the progress bar and 'X of Y days elapsed' caption measure the longer held window, and the status pill reads 'Grace period'. A check-in cancels the hold. Restoring a backup also refreshes the check-in clock: a restore is proof the owner is present, so it counts as a check-in — the clock restarts at the restore moment (the backup's clock is still validated, just not carried forward) and the restore is recorded in the check-in history. The danger zone is the last 25% of the check-in window: shortening the threshold, arming a transaction, or adding a new one while less than a quarter of the window is left (including already past due) resets your check-in to today and restarts the countdown instead of letting a release fire — the app asks first, and the server enforces it even for a direct API call. Cancelling the confirm snaps the toggle (and the threshold input) back to the saved value instead of leaving it showing a change you did not make."
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, or simply keeping a transaction ready for future use, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Set up periodic check-ins. If you fail to check in within your configured interval, Standby can automatically broadcast the designated transaction.

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
